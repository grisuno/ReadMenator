  # ── PHP (.php) ──────────────────────────────────────────────────────
  - rule_id: P001
    severity: critical
    description: "Use of eval — can lead to arbitrary code execution"
    patterns:
      - "\\beval\\s*\\("
      - "\\bassert\\s*\\(.*['\"]"
    cwe: CWE-95
    mitre_attack: T1059.007
    languages: [php]
    extensions: [.php]
  - rule_id: P002
    severity: high
    description: "Command injection via exec/system/shell_exec/passthru"
    patterns:
      - "\\bexec\\s*\\("
      - "\\bsystem\\s*\\("
      - "\\bshell_exec\\s*\\("
      - "\\bpassthru\\s*\\("
      - "\\bpopen\\s*\\("
      - "\\bproc_open\\s*\\("
    cwe: CWE-78
    mitre_attack: T1059.001
    languages: [php]
    extensions: [.php]
  - rule_id: P003
    severity: high
    description: "Possible SQL injection — direct query execution"
    patterns:
      - "mysql_query\\s*\\("
      - "mysqli_query\\s*\\("
      - "mysqli::query\\s*\\("
      - "->query\\s*\\(\\s*[\"']\\s*\\+\\s*"
      - "->prepare\\s*\\(\\s*[\"']\\s*\\+\\s*"
    cwe: CWE-89
    mitre_attack: T1190
    languages: [php]
    extensions: [.php]
  - rule_id: P004
    severity: high
    description: "Unsafe unserialize — can lead to arbitrary code execution"
    patterns:
      - "\\bunserialize\\s*\\("
    cwe: CWE-502
    mitre_attack: T1203
    languages: [php]
    extensions: [.php]
  - rule_id: P005
    severity: medium
    description: "XSS via direct output of user input (echo/print with $_GET/$_POST)"
    patterns:
      - "echo\\s+\\$_(?:GET|POST|REQUEST|SERVER\\[['\"]QUERY_STRING)"
      - "print\\s+\\$_(?:GET|POST|REQUEST)"
    cwe: CWE-79
    mitre_attack: T1204
    languages: [php]
    extensions: [.php]
  - rule_id: P006
    severity: medium
    description: "Remote file inclusion risk — include/require with variable"
    patterns:
      - "(?:include|require)(?:_once)?\\s*\\$"
      - "(?:include|require)(?:_once)?\\s*['\"].*\\{"
    cwe: CWE-98
    mitre_attack: T1190
    languages: [php]
    extensions: [.php]

  # ── Shell (.sh .bash .zsh) ──────────────────────────────────────────
  - rule_id: S001
    severity: critical
    description: "Command injection via eval — can execute arbitrary commands"
    patterns:
      - "\\beval\\s+\\$"
      - "\\beval\\s+\""
    cwe: CWE-78
    mitre_attack: T1059.001
    languages: [shell]
    extensions: [.sh, .bash, .zsh]
  - rule_id: S002
    severity: high
    description: "Source with variable — potential arbitrary file inclusion"
    patterns:
      - "\\bsource\\s+\\$"
      - "\\.\\s+\\$"
    cwe: CWE-98
    mitre_attack: T1059.001
    languages: [shell]
    extensions: [.sh, .bash, .zsh]
  - rule_id: S003
    severity: medium
    description: "Command substitution with user input — potential injection"
    patterns:
      - "\\$\\([^)]*\\$\\{"
      - "`[^`]*\\$\\{"
    cwe: CWE-78
    mitre_attack: T1059.001
    languages: [shell]
    extensions: [.sh, .bash, .zsh]
  - rule_id: S004
    severity: medium
    description: "export/declare with variable — potential environment injection"
    patterns:
      - "export\\s+\\$"
    cwe: CWE-78
    mitre_attack: ""
    languages: [shell]
    extensions: [.sh, .bash, .zsh]

