# ReadMenator security detection rules
# Externalized from _security.py for zero hardcoded patterns.
# Loaded dynamically at runtime by SecurityAnalyzer.
# Schema: rule_id, severity, description, patterns (list), cwe, mitre_attack, languages, extensions

rules:
  # ── Python (.py) ────────────────────────────────────────────────────
  - rule_id: PY001
    severity: critical
    description: "Command injection via os.system/os.popen or subprocess with shell=True"
    patterns:
      - "os\\.system\\s*\\("
      - "os\\.popen\\s*\\("
      - "subprocess\\s*\\.\\s*(?:call|Popen|run|check_call|check_output)\\s*\\([^)]*shell\\s*=\\s*True"
    cwe: CWE-78
    mitre_attack: T1059.001
    languages: [python]
    extensions: [.py]
  - rule_id: PY002
    severity: critical
    description: "Use of eval/exec — can lead to arbitrary code execution"
    patterns:
      - "\\beval\\s*\\("
      - "\\bexec\\s*\\("
      - "\\bcompile\\s*\\("
    cwe: CWE-95
    mitre_attack: T1059.007
    languages: [python]
    extensions: [.py]
  - rule_id: PY003
    severity: high
    description: "Unsafe deserialization via pickle — can execute arbitrary code"
    patterns:
      - "pickle\\.loads?\\s*\\("
      - "cloudpickle\\.loads?\\s*\\("
      - "dill\\.loads?\\s*\\("
    cwe: CWE-502
    mitre_attack: T1203
    languages: [python]
    extensions: [.py]
  - rule_id: PY004
    severity: high
    description: "Possible SQL injection — string concatenation or f-string in SQL query"
    patterns:
      - "(?:execute|executemany|rawSQL|raw_query)\\s*\\([^)]*\\+"
      - "(?:execute|executemany|rawSQL|raw_query)\\s*\\(\\s*f[\"']"
      - "cursor\\s*\\.\\s*(?:execute|executemany)\\s*\\([^)]*\\+"
    cwe: CWE-89
    mitre_attack: T1190
    languages: [python]
    extensions: [.py]
  - rule_id: PY005
    severity: medium
    description: "Hardcoded secret/credential detected"
    patterns:
      - "(?:password|passwd|pwd|secret|api_key|apikey|token|auth_token)\\s*[:=]\\s*['\"][^'\"]+"
    cwe: CWE-798
    mitre_attack: T1552.001
    languages: [python]
    extensions: [.py]
  - rule_id: PY006
    severity: medium
    description: "Weak cryptographic hash function (MD5/SHA1) used for security"
    patterns:
      - "hashlib\\.md5\\s*\\("
      - "hashlib\\.sha1\\s*\\("
    cwe: CWE-327
    mitre_attack: T1600
    languages: [python]
    extensions: [.py]
  - rule_id: PY007
    severity: medium
    description: "Path traversal risk — file operation with variable path"
    patterns:
      - "(?:open|Path)\\s*\\(\\s*(?:os\\.path\\.join|f[\"']|[\"']\\s*\\+\\s*|%[sd])"
      - "shutil\\.(?:copy|move|copytree|rmtree)\\s*\\([^)]*[\"']\\s*\\+\\s*"
    cwe: CWE-22
    mitre_attack: T1083
    languages: [python]
    extensions: [.py]
  - rule_id: PY008
    severity: medium
    description: "HTTP request with certificate verification disabled"
    patterns:
      - "requests\\.(?:get|post|put|delete|patch)\\s*\\([^)]*verify\\s*=\\s*False"
    cwe: CWE-295
    mitre_attack: T1573
    languages: [python]
    extensions: [.py]
  - rule_id: PY009
    severity: medium
    description: "Flask debug mode enabled — can expose debugger in production"
    patterns:
      - "app\\.run\\s*\\([^)]*debug\\s*=\\s*True"
    cwe: CWE-489
    mitre_attack: T1592
    languages: [python]
    extensions: [.py]
  - rule_id: PY010
    severity: low
    description: "Assert statement used — can be disabled with -O flag"
    patterns:
      - "\\bassert\\s+"
    cwe: CWE-670
    mitre_attack: ""
    languages: [python]
    extensions: [.py]
  - rule_id: PY011
    severity: low
    description: "Unsafe temporary file creation (mktemp) — race condition"
    patterns:
      - "tempfile\\.mktemp\\s*\\("
    cwe: CWE-377
    mitre_attack: ""
    languages: [python]
    extensions: [.py]
  - rule_id: PY012
    severity: high
    description: "Unsafe yaml.load — use yaml.safe_load instead"
    patterns:
      - "yaml\\.load\\s*\\((?!.*Loader)"
    cwe: CWE-502
    mitre_attack: T1203
    languages: [python]
    extensions: [.py]

  # ── JavaScript / TypeScript (.js .ts .jsx .tsx) ────────────────────
  - rule_id: JS001
    severity: high
    description: "XSS via innerHTML — can lead to cross-site scripting"
    patterns:
      - "\\.innerHTML\\s*="
      - "\\.outerHTML\\s*="
    cwe: CWE-79
    mitre_attack: T1204
    languages: [javascript, typescript]
    extensions: [.js, .ts, .jsx, .tsx]
  - rule_id: JS002
    severity: critical
    description: "Use of eval — can lead to arbitrary code execution"
    patterns:
      - "\\beval\\s*\\("
      - "\\bsetTimeout\\s*\\(\\s*['\"]"
      - "\\bsetInterval\\s*\\(\\s*['\"]"
    cwe: CWE-95
    mitre_attack: T1059.007
    languages: [javascript, typescript]
    extensions: [.js, .ts, .jsx, .tsx]
  - rule_id: JS003
    severity: high
    description: "Command injection via child_process exec/spawn with shell"
    patterns:
      - "child_process\\.(?:exec|execSync|spawn|spawnSync|fork)\\s*\\("
      - "require\\(['\"]child_process['\"]\\)"
    cwe: CWE-78
    mitre_attack: T1059.001
    languages: [javascript, typescript]
    extensions: [.js, .ts, .jsx, .tsx]
  - rule_id: JS004
    severity: medium
    description: "XSS via document.write — can lead to cross-site scripting"
    patterns:
      - "document\\.write\\s*\\("
    cwe: CWE-79
    mitre_attack: T1204
    languages: [javascript, typescript]
    extensions: [.js, .ts, .jsx, .tsx]
  - rule_id: JS005
    severity: high
    description: "Use of new Function() — similar to eval"
    patterns:
      - "new\\s+Function\\s*\\("
    cwe: CWE-95
    mitre_attack: T1059.007
    languages: [javascript, typescript]
    extensions: [.js, .ts, .jsx, .tsx]
  - rule_id: JS006
    severity: high
    description: "Possible SQL injection — string formatting in SQL query"
    patterns:
      - "execute\\s*\\(\\s*(?:f[\"']|[\"']\\s*\\+\\s*)"
      - "query\\s*\\(\\s*(?:f[\"']|[\"']\\s*\\+\\s*)"
    cwe: CWE-89
    mitre_attack: T1190
    languages: [javascript, typescript]
    extensions: [.js, .ts, .jsx, .tsx]
  - rule_id: JS007
    severity: high
    description: "XSS via dangerouslySetInnerHTML in React"
    patterns:
      - "dangerouslySetInnerHTML"
    cwe: CWE-79
    mitre_attack: T1204
    languages: [javascript, typescript]
    extensions: [.js, .ts, .jsx, .tsx]

  # ── C / C++ (.c .cpp .cc .cxx .h .hpp .hxx) ───────────────────────
  - rule_id: C001
    severity: high
    description: "Buffer overflow risk: strcpy — use strncpy or snprintf instead"
    patterns:
      - "\\bstrcpy\\s*\\("
    cwe: CWE-121
    mitre_attack: T1204
    languages: [c, cpp]
    extensions: [.c, .cpp, .cc, .cxx, .h, .hpp, .hxx]
  - rule_id: C002
    severity: high
    description: "Buffer overflow risk: strcat — use strncat instead"
    patterns:
      - "\\bstrcat\\s*\\("
    cwe: CWE-121
    mitre_attack: T1204
    languages: [c, cpp]
    extensions: [.c, .cpp, .cc, .cxx, .h, .hpp, .hxx]
  - rule_id: C003
    severity: critical
    description: "Buffer overflow risk: gets — use fgets instead"
    patterns:
      - "\\bgets\\s*\\("
    cwe: CWE-120
    mitre_attack: T1204
    languages: [c, cpp]
    extensions: [.c, .cpp, .cc, .cxx, .h, .hpp, .hxx]
  - rule_id: C004
    severity: high
    description: "Buffer overflow risk: sprintf — use snprintf instead"
    patterns:
      - "\\bsprintf\\s*\\("
    cwe: CWE-121
    mitre_attack: T1204
    languages: [c, cpp]
    extensions: [.c, .cpp, .cc, .cxx, .h, .hpp, .hxx]
  - rule_id: C005
    severity: medium
    description: "Unbounded input: scanf with %s — limit buffer size"
    patterns:
      - "\\bscanf\\s*\\(\\s*[\"'][^\"']*%s"
    cwe: CWE-120
    mitre_attack: ""
    languages: [c, cpp]
    extensions: [.c, .cpp, .cc, .cxx, .h, .hpp, .hxx]
  - rule_id: C006
    severity: high
    description: "Command injection via system() — use execve instead"
    patterns:
      - "\\bsystem\\s*\\("
    cwe: CWE-78
    mitre_attack: T1059.001
    languages: [c, cpp]
    extensions: [.c, .cpp, .cc, .cxx, .h, .hpp, .hxx]
  - rule_id: C007
    severity: medium
    description: "Command injection via popen() — use execve instead"
    patterns:
      - "\\bpopen\\s*\\("
    cwe: CWE-78
    mitre_attack: T1059.001
    languages: [c, cpp]
    extensions: [.c, .cpp, .cc, .cxx, .h, .hpp, .hxx]
  - rule_id: C008
    severity: medium
    description: "Stack overflow risk: alloca — use heap allocation instead"
    patterns:
      - "\\balloca\\s*\\("
    cwe: CWE-770
    mitre_attack: ""
    languages: [c, cpp]
    extensions: [.c, .cpp, .cc, .cxx, .h, .hpp, .hxx]

