[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"

[project]
name = "readmenator"
version = "1.0.1"
description = "Zero-token polyglot codebase knowledge graph generator"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "AGPL-3.0"}
authors = [
    {name = "Gris Iscomeback"},
]
keywords = ["static-analysis", "knowledge-graph", "codebase", "mermaid", "documentation"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Documentation",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/grisuno/ReadMenator"
Repository = "https://github.com/grisuno/ReadMenator"
Documentation = "https://github.com/grisuno/ReadMenator"
Issues = "https://github.com/grisuno/ReadMenator/issues"

[project.scripts]
readmenator = "readmenator.__main__:main"
readmenator-mcp = "readmenator._mcp_server:main"

[tool.hatch.build.targets.sdist]
include = [
    "/readmenator",
    "/readmenator.py",
    "/readmenator_orchestrator.py",
    "/tests",
]

[tool.hatch.build.targets.wheel]
packages = ["readmenator"]
